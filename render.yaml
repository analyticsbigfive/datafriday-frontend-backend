services:
  - type: web
    name: datafriday-api
    runtime: node
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: cd backend && npm install -g pnpm@10 && pnpm install --frozen-lockfile && npx prisma generate && npx @nestjs/cli build
    startCommand: cd backend && npx prisma migrate deploy && node dist/main
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: REDIS_QUEUE_URL
        sync: false
      - key: LOG_LEVEL
        value: info
      # BUG-144-01 : WeezeventCronService tourne aussi dans datafriday-worker (dédié). Le
      # laisser actif ici en plus fait tourner les mêmes crons deux fois en parallèle (un
      # process web ET un worker) et, surtout, expose la synchro live à un OOM du process
      # web (ex. page Analyse Jean Bouin, cf. BUG-144-01) qui tue le scheduler avec lui.
      - key: WEEZEVENT_CRON_ENABLED
        value: "false"

  - type: worker
    name: datafriday-worker
    runtime: node
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: cd backend && npm install -g pnpm@10 && pnpm install --frozen-lockfile && npx prisma generate && npx @nestjs/cli build
    startCommand: cd backend && npx prisma migrate deploy && node dist/worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: LOG_LEVEL
        value: info
