# Render : description de l'infrastructure backend (seule référence, backend/render.yaml retiré).
#
# Deux services, mêmes variables via le groupe « datafriday-backend-env » :
#  - datafriday-backend : API HTTP. N'exécute ni crons ni files (BACKGROUND_JOBS_IN_API=false).
#  - datafriday-worker  : seul process qui exécute les crons (cycle d'inventaire, fenêtres PIN,
#    envoi des comptages vers Logistic, synchro Weezevent) et consomme les files BullMQ.
# Sans worker, mettre BACKGROUND_JOBS_IN_API=true sur l'API ; jamais les deux à la fois
# (chaque cron tournerait deux fois et chaque file aurait deux consommateurs).
#
# Migrations : jamais au démarrage (ADR-0002), toujours à la main avant le déploiement du code.
# Plans : à aligner sur le dashboard (offre pro) avant toute synchronisation de ce fichier.

envVarGroups:
  - name: datafriday-backend-env
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      # Redis du cache et Redis des files : MÊMES valeurs pour l'API (producteur) et le worker
      # (consommateur), sinon le worker ne voit aucun job.
      - key: REDIS_URL
        sync: false
      - key: REDIS_QUEUE_URL
        sync: false
      - key: GUEST_PIN_JWT_SECRET
        sync: false
      - key: GUEST_PIN_HMAC_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: INVITE_REDIRECT_URL
        value: https://datafriday.fr/accept-invite
      # `warn` au premier déploiement de la remédiation (requête hors contexte tenant journalisée),
      # puis `strict` une fois les journaux propres.
      - key: TENANT_SCOPE_MODE
        value: warn
      - key: LOG_LEVEL
        value: info

services:
  - type: web
    name: datafriday-backend
    runtime: node
    region: frankfurt
    rootDir: backend
    buildCommand: npm install -g pnpm@10 && pnpm install --frozen-lockfile && npx prisma generate && npx @nestjs/cli build
    startCommand: node dist/main
    healthCheckPath: /api/v1/health
    envVars:
      - fromGroup: datafriday-backend-env
      - key: PORT
        value: 3000
      - key: BACKGROUND_JOBS_IN_API
        value: "false"

  - type: worker
    name: datafriday-worker
    runtime: node
    region: frankfurt
    plan: starter
    rootDir: backend
    buildCommand: npm install -g pnpm@10 && pnpm install --frozen-lockfile && npx prisma generate && npx @nestjs/cli build
    startCommand: node dist/worker
    envVars:
      - fromGroup: datafriday-backend-env
