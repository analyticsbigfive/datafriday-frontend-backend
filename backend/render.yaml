# Render Blueprint
# Documentation: https://render.com/docs/blueprint-spec

services:
  # API NestJS
  - type: web
    name: datafriday-api
    runtime: node
    region: frankfurt  # ou oregon
    plan: free  # ou starter ($7/mois) pour plus de ressources
    buildCommand: npm install -g pnpm@10 && pnpm install --frozen-lockfile && npx prisma generate && npx @nestjs/cli build
    # Pas de "prisma migrate deploy" ici : migrations toujours manuelles (ADR-0002).
    # prisma/migrations/* est versionné (depuis le 2026-08-02) donc ce serait sinon
    # un vrai déclenchement, pas un no-op — voir l'ADR pour le détail de l'incident.
    startCommand: node dist/main
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        sync: false  # À configurer manuellement
      - key: DIRECT_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: REDIS_URL
        sync: false  # Upstash Redis URL
      - key: CORS_ORIGINS
        sync: false  # Set in Render dashboard: https://datafriday.fr,https://app.datafriday.fr
      - key: INVITE_REDIRECT_URL
        value: https://datafriday.fr/accept-invite
      - key: REDIS_QUEUE_URL
        sync: false  # Redis des files BullMQ : MÊME valeur que sur datafriday-worker
      - key: GUEST_PIN_JWT_SECRET
        sync: false
      - key: GUEST_PIN_HMAC_SECRET
        sync: false
      # Repli uniquement si datafriday-worker n'est pas déployé : l'API exécute alors les
      # crons et consomme les files. Jamais "true" quand le worker tourne.
      - key: BACKGROUND_JOBS_IN_API
        value: "false"
      - key: LOG_LEVEL
        value: info

  # BullMQ Worker (background job processor, no HTTP). Seul process qui exécute les crons
  # et consomme les files. Render ne propose pas de background worker en plan gratuit.
  - type: worker
    name: datafriday-worker
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: npm install -g pnpm@10 && pnpm install --frozen-lockfile && npx prisma generate && npx @nestjs/cli build
    # Idem service API ci-dessus : pas de migration auto au démarrage (ADR-0002).
    startCommand: node dist/worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: REDIS_QUEUE_URL
        sync: false  # MÊME valeur que sur datafriday-api, sinon le worker ne voit aucun job
      - key: GUEST_PIN_JWT_SECRET
        sync: false  # requis : le cron de clôture des fenêtres PIN charge GuestPinAccessModule
      - key: GUEST_PIN_HMAC_SECRET
        sync: false
      - key: LOG_LEVEL
        value: info
